# AI-assisted: Grok 4.7 via Cursor, 2026-10-06: wrote the BeaconMind package metadata and pytest options, then pinned dev, b1 and metrics from the Spark freeze, and pinned providers from the beaconmind-ros container.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "beaconmind"
version = "0.1.0"
description = "BeaconMind: an LLM owns landmark SLAM (EN.665.715 course project, Xiaohui Chen)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# container pins (beaconmind-ros, Python 3.10.12, 2026-10-06): pytest==9.1.1, jsonschema==4.26.0
dev = ["pytest==9.1.1", "jsonschema==4.26.0"]
# container pins (beaconmind-ros, Python 3.10.12, 2026-10-06): openai==3.26.0, anthropic==1.11.0
providers = ["openai==3.26.0", "anthropic==1.11.0"]
b1 = ["gtsam==4.3.0"]
metrics = ["numpy==2.5.3", "scipy==1.18.1", "statsmodels==0.15.0", "evo==1.37.1", "matplotlib==3.11.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beaconmind = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm and not isaac and not hardware and not gtsam'"
markers = [
  "llm: needs the vLLM server or a frontier API (run on the Spark)",
  "isaac: needs Isaac Sim (run on the Spark host)",
  "hardware: needs the car, the Pico or the camera",
  "gtsam: needs gtsam (Spark host venv only)",
]
